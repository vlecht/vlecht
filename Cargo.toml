[workspace]
resolver = "2"
members = ["vlecht", "vlecht-db", "vlecht-git"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
thiserror = "2"
clap = { version = "4", features = ["derive"] }


[patch.crates-io]
gix-hash = { path = "gix-hash-patched" }
